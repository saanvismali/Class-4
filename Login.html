<html>
    <head>
        <title>Login </title>
        <link rel="stylesheet" type="text/css" href="static/styles/styles.css"></link>
    </head>
    <body>
        <div align="center">
        <div align="center" class="border">
        <div class="header">
        <h1 class="word">Login</h1>
        </div>
        <h2 class="word">
        <from action="/login" method="post">
        <div class="msg">{{msg}}</div>
        <input id="username" name="username" type="text" placeholder="Enter your username" class="textbox"><br></br>
        <input id="password" name="password" type="password" placeholder="Enter your password" class="textbox"><br></br>
        <input type="submit" value="Login" class="btn"><br></br>
        </from>
        </h2>
        <p class="bottom"> Don't have an account? <a class="bottom" href="/Registration">Sign up here</a></p>
        </div>
        </div>
    </body>
    </html>
