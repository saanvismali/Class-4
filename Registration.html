<body>
    <div align="center">
    <div align="center" class="border">
    <div class="header">
    <h1 class="word">Registration</h1>
    </div>
    <h2 class="word">
    <form action="/Registration" method="post">
    <div class="msg">{{msg}}</div>
    <input id="username" name="username" type="text" placeholder="Enter your username" class="textbox"><br></br>
    <input id="password" name="password" type="password" placeholder="Enter your password" class="textbox"><br></br>
    <input id="email" name="email" type="email" placeholder="Enter your email" class="textbox"><br></br>
    <input type="submit" value="Sign up" class="btn"><br></br>
    </form>
    </h2>
    <p class="bottom"> Already have an account? <a class="bottom" href="/Login">Sign in here</a></p>
    </div>
    </div>
</body>
